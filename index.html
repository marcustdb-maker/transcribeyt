<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranscribeYT - Transcrição de Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <nav class="bg-zinc-900 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-bold text-blue-500">YT</span>
                <span class="text-2xl font-bold">TranscribeYT</span>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-8">
        <h1 class="text-4xl font-bold text-center mb-8">TranscribeYT</h1>
        
        <div class="bg-zinc-900 p-8 rounded-3xl">
            <input id="url" type="text" value="https://www.youtube.com/watch?v=-VFTBwTxfJg" 
                   class="w-full p-4 bg-zinc-800 rounded-2xl mb-4 outline-none">
            
            <button onclick="transcribe()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-lg">
                Transcrever Vídeo
            </button>
            
            <div id="loading" class="hidden text-center my-8">
                <div class="animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto"></div>
                <p class="mt-4">Processando...</p>
            </div>
            
            <div id="result" class="hidden mt-8">
                <pre id="text" class="bg-black p-6 rounded-2xl text-sm overflow-auto max-h-96"></pre>
                <button onclick="copyText()" class="mt-4 px-6 py-3 bg-zinc-700 rounded-2xl">Copiar Texto</button>
            </div>
        </div>
    </div>

    <script>
        async function transcribe() {
            const url = document.getElementById('url').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            loading.classList.remove('hidden');
            result.classList.add('hidden');
            
            try {
                const res = await fetch('/transcribe', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const data = await res.json();
                
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                document.getElementById('text').textContent = data.transcription || data.error || 'Erro';
            } catch(e) {
                loading.classList.add('hidden');
                alert('Erro ao conectar com servidor');
            }
        }
        
        function copyText() {
            const text = document.getElementById('text').textContent;
            navigator.clipboard.writeText(text);
            alert('Copiado!');
        }
    </script>
</body>
</html>
